<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>onsgmls in the page</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #dcdcde;
    --accent: #2a5db0; --ok: #1f7a3a; --bad: #b3261e; --code: #f4f4f2;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618; --panel: #1f1f22; --ink: #ececee; --muted: #9a9aa2; --line: #34343a;
      --accent: #7aa7f0; --ok: #6cc788; --bad: #f08a80; --code: #26262a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: var(--muted); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
            padding: 14px; margin-bottom: 16px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
       margin: 0 0 10px; font-weight: 600; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .tab { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px;
         padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .tab[aria-selected="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .row label { font-size: 13px; color: var(--muted); }
  input[type="text"] { flex: 1 1 220px; min-width: 0; padding: 6px 8px; border: 1px solid var(--line);
                       border-radius: 6px; background: var(--bg); color: var(--ink);
                       font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  textarea { width: 100%; min-height: 220px; resize: vertical; padding: 10px; border: 1px solid var(--line);
             border-radius: 6px; background: var(--code); color: var(--ink);
             font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; tab-size: 2; }
  button { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .cmd { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
         overflow-wrap: anywhere; }
  #status { font-size: 14px; }
  #status.ok { color: var(--ok); }
  #status.bad { color: var(--bad); }
  pre { margin: 0; padding: 10px; background: var(--code); border-radius: 6px; overflow: auto;
        max-height: 420px; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
  .outputs { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 860px) { .outputs { grid-template-columns: 1fr 1fr; } }
  .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<main>
  <h1>onsgmls in the page</h1>
  <p class="lead">OpenSP's SGML parser, ported to Scaly and compiled to WebAssembly, running in this
  browser tab. The files below are its file system; nothing leaves the page.</p>

  <section>
    <h2>Files</h2>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="row">
      <label for="filename">Name</label>
      <input type="text" id="filename" spellcheck="false">
      <button id="add">New file</button>
      <button id="open">Open files…</button>
      <button id="remove">Remove</button>
      <input type="file" id="picker" multiple hidden>
    </div>
    <textarea id="content" spellcheck="false" aria-label="File content"></textarea>
  </section>

  <section>
    <h2>Run</h2>
    <div class="row">
      <label for="args">Options</label>
      <input type="text" id="args" spellcheck="false" placeholder="e.g. -wall  or  -s">
    </div>
    <div class="row">
      <label for="env">Environment</label>
      <input type="text" id="env" spellcheck="false" placeholder="e.g. SP_CHARSET_FIXED=YES SP_ENCODING=XML">
    </div>
    <div class="row">
      <button class="primary" id="run" disabled>Parse</button>
      <span id="status">Loading the parser…</span>
    </div>
    <div class="cmd" id="cmd"></div>
  </section>

  <div class="outputs">
    <section>
      <h2>ESIS</h2>
      <pre id="esis"><span class="empty">Nothing yet.</span></pre>
    </section>
    <section>
      <h2>Messages</h2>
      <pre id="messages"><span class="empty">Nothing yet.</span></pre>
    </section>
  </div>
  <section id="written-section" hidden>
    <h2>Files written</h2>
    <div id="written"></div>
  </section>
</main>

<script type="module">
import { MemoryFiles, Wasi } from './wasi.mjs';

// The document is the first file; the parser runs in /work, so a system
// identifier such as "memo.dtd" names /work/memo.dtd.
const WORK = '/work';
const files = [
  { name: 'memo.sgm', text:
`<!DOCTYPE memo SYSTEM "memo.dtd">
<memo>
<to>The team
<from>The parser
<body>
<p>This document was parsed in your browser.
<p>Edit it, or the DTD, and parse again.
</memo>
` },
  { name: 'memo.dtd', text:
`<!ELEMENT memo - - (to, from, body)>
<!ELEMENT (to | from) - O (#PCDATA)>
<!ELEMENT body - O (p+)>
<!ELEMENT p - O (#PCDATA)>
` },
];
let current = 0;
let module = null;

const $ = id => document.getElementById(id);

function render_tabs() {
  const tabs = $('tabs');
  tabs.replaceChildren(...files.map((f, i) => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.role = 'tab';
    b.textContent = i === 0 ? f.name + ' (document)' : f.name;
    b.setAttribute('aria-selected', String(i === current));
    b.onclick = () => select(i);
    return b;
  }));
  $('filename').value = files[current].name;
  $('content').value = files[current].text;
  $('remove').disabled = files.length < 2;
  render_command();
}

function select(i) {
  current = i;
  render_tabs();
}

function split_words(s) {
  return s.trim() === '' ? [] : s.trim().split(/\s+/);
}

function command_args() {
  return ['onsgmls', ...split_words($('args').value), files[0].name];
}

function render_command() {
  const env = split_words($('env').value);
  $('cmd').textContent = 'cd ' + WORK + ' && ' + (env.length ? env.join(' ') + ' ' : '') + command_args().join(' ');
}

$('content').addEventListener('input', e => { files[current].text = e.target.value; });
$('filename').addEventListener('input', e => {
  files[current].name = e.target.value.trim() || 'untitled';
  render_tabs();
  $('filename').focus();
});
$('args').addEventListener('input', render_command);
$('env').addEventListener('input', render_command);
$('add').onclick = () => {
  files.push({ name: 'file' + files.length + '.sgm', text: '' });
  select(files.length - 1);
};
$('remove').onclick = () => {
  if (files.length < 2) return;
  files.splice(current, 1);
  select(Math.max(0, current - 1));
};
$('open').onclick = () => $('picker').click();
$('picker').onchange = async e => {
  for (const file of e.target.files) {
    const text = await file.text();
    const at = files.findIndex(f => f.name === file.name);
    if (at >= 0) files[at].text = text; else files.push({ name: file.name, text });
  }
  e.target.value = '';
  select(files.length - 1);
};

function show(pre, text) {
  if (text === '') {
    pre.replaceChildren(Object.assign(document.createElement('span'), { className: 'empty', textContent: 'Nothing.' }));
  } else {
    pre.textContent = text;
  }
}

async function parse() {
  render_command();
  const memory = new MemoryFiles(Object.fromEntries(files.map(f => [WORK + '/' + f.name, f.text])));
  const env = Object.fromEntries(split_words($('env').value).map(kv => {
    const at = kv.indexOf('=');
    return at < 0 ? [kv, ''] : [kv.slice(0, at), kv.slice(at + 1)];
  }));
  const wasi = new Wasi({ args: command_args(), env, cwd: WORK, files: memory });
  const instance = await WebAssembly.instantiate(module, wasi.imports());
  const started = performance.now();
  let status;
  try {
    status = wasi.start(instance);
  } catch (e) {
    status = 'trap: ' + e.message;
  }
  const ms = Math.round(performance.now() - started);
  show($('esis'), wasi.stdout_text());
  show($('messages'), wasi.stderr_text());
  const s = $('status');
  s.textContent = typeof status === 'number' ? 'exit ' + status + ' in ' + ms + ' ms' : status;
  s.className = status === 0 ? 'ok' : 'bad';
  const written = memory.written;
  $('written-section').hidden = written.length === 0;
  $('written').replaceChildren(...written.map(path => {
    const div = document.createElement('div');
    const h = Object.assign(document.createElement('div'), { className: 'cmd', textContent: path });
    const pre = document.createElement('pre');
    pre.textContent = memory.text(path);
    div.append(h, pre);
    return div;
  }));
}

$('run').onclick = () => {
  $('run').disabled = true;
  $('status').textContent = 'Parsing…';
  $('status').className = '';
  // let the status paint before the parse holds the thread
  setTimeout(() => parse().finally(() => { $('run').disabled = false; }), 0);
};

render_tabs();
try {
  const response = await fetch('onsgmls.wasm');
  if (!response.ok) throw new Error('onsgmls.wasm: ' + response.status + ' (run web/onsgmls/build.sh)');
  module = await WebAssembly.compile(await response.arrayBuffer());
  $('status').textContent = 'Ready.';
  $('run').disabled = false;
} catch (e) {
  $('status').textContent = String(e.message || e);
  $('status').className = 'bad';
}
</script>
</body>
</html>
