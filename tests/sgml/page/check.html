<!doctype html>
<meta charset="utf-8">
<title>onsgmls page check</title>
<!-- tests/sgml/page.sh: drives index.html in a frame the way a reader does
     (type, click Parse, read the panes) and writes its verdict into #verdict,
     which the script reads from the DOM headless Chrome dumps. -->
<pre id="verdict">pending</pre>
<iframe id="page" src="index.html" width="1000" height="900"></iframe>
<script>
const frame = document.getElementById('page');
const lines = [];
let failed = 0;

function check(name, ok, detail) {
  lines.push((ok ? 'PASS ' : 'FAIL ') + name + (ok ? '' : ' -- ' + detail));
  if (!ok) failed++;
}

function wait(cond, what) {
  return new Promise((resolve, reject) => {
    const t0 = Date.now();
    const tick = () => {
      let v;
      try { v = cond(); } catch { }
      if (v) resolve(v);
      else if (Date.now() - t0 > 20000) reject(new Error('timeout waiting for ' + what));
      else setTimeout(tick, 50);
    };
    tick();
  });
}

frame.onload = async () => {
  const d = frame.contentDocument;
  const $ = id => d.getElementById(id);
  const text = id => $(id).textContent;
  const type = (id, value) => { $(id).value = value; $(id).dispatchEvent(new Event('input')); };
  const parse = async () => {
    $('run').click();
    await wait(() => /^(exit|trap)/.test(text('status')) && !$('run').disabled, 'the parse');
  };
  try {
    await wait(() => text('status') === 'Ready.', 'the module to load');

    // 1. the document the page opens with, against its DTD
    await parse();
    check('valid document: exit 0', /^exit 0 /.test(text('status')), text('status'));
    check('valid document: ESIS', text('esis').startsWith('(MEMO\n(TO\n-The team\n)TO\n(FROM\n') && text('esis').endsWith(')MEMO\nC\n'), JSON.stringify(text('esis')));
    check('valid document: no messages', text('messages') === 'Nothing.', text('messages'));

    // 2. an element the DTD requires left out, the RAST written to a file
    type('content', '<!DOCTYPE memo SYSTEM "memo.dtd">\n<memo>\n<to>The team\n<body>\n<p>No from.\n</memo>\n');
    type('args', '-t out.rast');
    await parse();
    check('invalid document: exit 1', /^exit 1 /.test(text('status')), text('status'));
    check('invalid document: the message', text('messages').includes('onsgmls:memo.sgm:4:5:E: start tag for "FROM" omitted'), text('messages'));
    check('invalid document: no ESIS with -t', text('esis') === 'Nothing.', text('esis'));
    check('-t: the file written', !$('written-section').hidden && text('written') === '/work/out.rast#ERROR\n', JSON.stringify(text('written')));
    check('command line shown', text('cmd') === 'cd /work && onsgmls -t out.rast memo.sgm', text('cmd'));

    // 3. the DTD changed in its own tab: the same document is valid
    $('tabs').children[1].click();
    type('content', $('content').value.replace('(to, from, body)', '(to, from?, body)'));
    type('args', '');
    await parse();
    check('changed DTD: exit 0', /^exit 0 /.test(text('status')), text('status'));
    check('changed DTD: ESIS', text('esis') === '(MEMO\n(TO\n-The team\n)TO\n(BODY\n(P\n-No from.\n)P\n)BODY\n)MEMO\nC\n', JSON.stringify(text('esis')));
    check('changed DTD: nothing written', $('written-section').hidden, text('written'));
  } catch (e) {
    check('the page', false, e.message);
  }
  lines.push(failed === 0 ? 'page: all ' + lines.length + ' checks PASS' : 'page: ' + failed + ' FAIL');
  document.getElementById('verdict').textContent = lines.join('\n');
};
</script>
