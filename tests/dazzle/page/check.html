<!doctype html>
<meta charset="utf-8">
<title>dazzle page check</title>
<!-- tests/dazzle/page.sh: drives index.html in a frame the way a reader does
     (click, edit, change the scale, look at the canvas) and writes its
     verdict into #verdict, which the script reads from the DOM headless Chrome
     dumps. -->
<pre id="verdict">pending</pre>
<iframe id="page" src="index.html" width="1400" height="1000"></iframe>
<script>
const frame = document.getElementById('page');
const lines = [];
let failed = 0;

function check(name, ok, detail) {
  lines.push((ok ? 'PASS ' : 'FAIL ') + name + (ok ? '' : ' -- ' + detail));
  if (!ok) failed++;
}

function wait(cond, what, limit = 30000) {
  return new Promise((resolve, reject) => {
    const t0 = Date.now();
    const tick = () => {
      let v;
      try { v = cond(); } catch { }
      if (v) resolve(v);
      else if (Date.now() - t0 > limit) reject(new Error('timeout waiting for ' + what));
      else setTimeout(tick, 50);
    };
    tick();
  });
}

// the share of dark pixels in a band of the canvas (fractions of its height)
function ink(canvas, from, to) {
  const ctx = canvas.getContext('2d');
  const y0 = Math.floor(canvas.height * from), y1 = Math.floor(canvas.height * to);
  const data = ctx.getImageData(0, y0, canvas.width, y1 - y0).data;
  let dark = 0;
  for (let i = 0; i < data.length; i += 4)
    if (data[i] < 128 && data[i + 1] < 128 && data[i + 2] < 128) dark++;
  return dark / (data.length / 4);
}

frame.onload = async () => {
  const d = frame.contentDocument;
  const $ = id => d.getElementById(id);
  const text = id => $(id).textContent;
  const type = (id, value) => { $(id).value = value; $(id).dispatchEvent(new Event('input')); };
  const set_pages = async () => {
    $('run').click();
    await wait(() => text('status') !== 'Setting the pages…' && !$('run').disabled, 'the pages');
  };
  try {
    // the page sets its example as soon as the module is compiled, which
    // takes long while other suites run beside it
    await wait(() => /^exit /.test(text('status')) && !$('run').disabled, 'the example set at load', 120000);

    // 1. the example, the newsletter: two A5 pages, the first shown
    check('example: exit 0, two pages', /^exit 0, 2 pages set/.test(text('status')), text('status'));
    const canvases = $('pages').querySelectorAll('canvas');
    check('example: one canvas, page by page', canvases.length === 1, canvases.length);
    const c = canvases[0];
    // 148 mm at 96 pixels to the inch
    const width = parseFloat(c?.style.width);
    check('example: the page is 148 mm wide', Math.abs(width - 148 / 25.4 * 96) < 1, width);
    // the masthead is green, not dark: the first dark ink is the lead's title
    check('example: no dark ink above the lead', c && ink(c, 0, 0.05) === 0, c && ink(c, 0, 0.05));
    check('example: ink in the body', c && ink(c, 0.15, 0.80) > 0.01, c && ink(c, 0.15, 0.80));
    // the front page model's footer, at the bottom of its region (200 mm of 210)
    check('example: the footer of the front page', c && ink(c, 0.93, 0.97) > 0.005, c && ink(c, 0.93, 0.97));
    check('example: no ink below the region', c && ink(c, 0.975, 1) === 0, c && ink(c, 0.975, 1));
    check('example: no messages', text('messages') === 'Nothing.', text('messages'));

    // 1b. the next page, on the left page model: a header above the text
    $('next').click();
    const c2 = $('pages').querySelector('canvas');
    check('next page: page 2 shown', $('page').value === '2' && c2 !== c, $('page').value);
    check('next page: the header of its model', c2 && ink(c2, 0.05, 0.08) > 0.01, c2 && ink(c2, 0.05, 0.08));
    check('next page: no ink above the region', c2 && ink(c2, 0, 0.05) === 0, c2 && ink(c2, 0, 0.05));
    $('first').click();

    // 2. a stylesheet that names what is not defined: the engine says so --
    // set with the button, Live off (typing would start a run of its own, and
    // a click while one runs only asks for another after it)
    $('live').checked = false;
    $('tabs').children[1].click();
    type('content', $('content').value.replace('font-size: 11pt', 'font-size: %no-such-size%'));
    await set_pages();
    check('error: the message', /%no-such-size%/.test(text('messages')) && /:E:/.test(text('messages')), text('messages'));
    $('tabs').children[1].click();
    type('content', $('content').value.replace('font-size: %no-such-size%', 'font-size: 11pt'));
    await set_pages();
    check('error undone: exit 0 again', /^exit 0, 2 pages set/.test(text('status')), text('status'));

    // 2b. live (on by default): an edit is set without the button
    $('live').checked = true;
    const reached = (cond, what) => wait(cond, what, 10000).then(() => true, () => false);
    type('content', $('content').value.replace('font-size: 11pt', 'font-size: %no-such-size%'));
    check('live: the error reported as typed', await reached(() => /%no-such-size%/.test(text('messages')), 'the live run'),
      text('messages'));
    type('content', $('content').value.replace('font-size: %no-such-size%', 'font-size: 11pt'));
    check('live: the fix set as typed', await reached(() => text('messages') === 'Nothing.' && /^exit 0, 2 pages set/.test(text('status')),
      'the live run after the fix'), text('status') + ' / ' + text('messages'));

    // 3. the scale: the same page twice as large
    $('scale').value = '2';
    $('scale').dispatchEvent(new Event('change'));
    await wait(() => parseFloat($('pages').querySelector('canvas')?.style.width) > width * 1.5, 'the page drawn again');
    const twice = parseFloat($('pages').querySelector('canvas').style.width);
    check('scale 200 %: twice as wide', Math.abs(twice - 2 * width) < 1, twice);
    // 4. an image given as a PDF is drawn from its page's content: a blue
    // rectangle in a 20 x 14 pt box, placed at 10 x 8 pt on a 40 x 30 pt page
    const { load_images, draw_page } = await import('./pages.mjs');
    const form = { fonts: [], images: [{ file: 'box.pdf', width: 20, height: 14,
      form: { box: [0, 0, 20000, 14000], content: 'q\n2 w\n0 0 1 RG\n1 1 18 12 re\nS\nQ\n' } }],
      pages: [{ width: 40000, height: 30000, ops: [['image', 10000, 8000, 20000, 14000, 0]] }] };
    const fc = document.createElement('canvas');
    draw_page(fc, form, 0, { faces: [], images: await load_images(form, () => null), scale: 3 });
    // u pixels to the point (4 at a pixel ratio of 1): the box spans 10..30 pt
    // across and 8..22 pt down
    const u = fc.width / 40;
    const px = fc.getContext('2d').getImageData(0, 0, fc.width, fc.height).data;
    let inside = 0, outside = 0;
    for (let i = 0; i < px.length; i += 4) {
      if (!(px[i + 2] > 200 && px[i] < 100 && px[i + 1] < 100)) continue;
      const x = (i / 4) % fc.width, y = Math.floor(i / 4 / fc.width);
      if (x >= 10 * u && x <= 30 * u && y >= 8 * u && y <= 22 * u) inside++; else outside++;
    }
    check('a PDF image: its content drawn in its box', inside > 100 && outside === 0, 'inside ' + inside + ', outside ' + outside);
    // 5. line-dash: a dashed line has gaps along it (6 pt dashes, 3 pt gaps),
    // a solid one none
    const lines = { fonts: [], images: [], pages: [{ width: 40000, height: 20000, ops: [
      ['line', 2000, 5000, 38000, 5000, 1000, '#000000', [6000, 3000], 0],
      ['line', 2000, 15000, 38000, 15000, 1000, '#000000']] }] };
    const lc = document.createElement('canvas');
    draw_page(lc, lines, 0, { faces: [], images: [], scale: 3 });
    // v pixels to the point: the lines at 5 and 15 pt down, from 2 to 38 pt
    // across; the row read from 3 to 37 pt
    const v = lc.width / 40;
    const row = y => { const r = lc.getContext('2d').getImageData(0, y * v, lc.width, 1).data; let dark = 0;
      for (let x = 3 * v; x < 37 * v; x++) if (r[x * 4] < 128) dark++; return dark; };
    const dashed = row(5), solid = row(15);
    check('line-dash: gaps in the dashed line, none in the solid one',
      dashed > 0.5 * solid && dashed < 0.8 * solid && solid === 34 * v, 'dashed ' + dashed + ', solid ' + solid);
  } catch (e) {
    check('the page', false, e.message);
  }
  lines.push(failed === 0 ? 'page: all ' + lines.length + ' checks PASS' : 'page: ' + failed + ' FAIL');
  document.getElementById('verdict').textContent = lines.join('\n');
};
</script>
